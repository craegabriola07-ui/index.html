<!-- SOCIAL COMMUNITY SECTION -->

<style>

.social-section{
    width:90%;
    max-width:1050px;
    margin:70px auto 0;
}

.social-title{
    text-align:center;
    margin-bottom:35px;
}

.social-title .small-title{
    color:#b75cff;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.social-title h2{
    font-family:Georgia,serif;
    font-size:38px;
    font-weight:500;
    letter-spacing:2px;
    margin:0;
}

.social-title p{
    color:#888;
    margin-top:12px;
}

.social-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.social-card{
    position:relative;
    overflow:hidden;
    min-height:390px;
    padding:45px 30px;
    text-align:center;

    background:#080808;

    border:1px solid rgba(191,130,255,.65);
    border-radius:24px;

    box-shadow:
        0 0 25px rgba(139,43,255,.08),
        inset 0 0 30px rgba(139,43,255,.025);

    transition:.3s ease;
}

.social-card:hover{
    transform:translateY(-6px);

    box-shadow:
        0 0 35px rgba(174,67,255,.25),
        inset 0 0 30px rgba(174,67,255,.04);
}


/* LOGO */

.social-logo{
    width:105px;
    height:105px;

    margin:0 auto 28px;

    border-radius:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:55px;
    font-weight:800;

    color:white;

    box-shadow:0 0 30px rgba(255,255,255,.15);
}


/* DISCORD */

.discord-logo{
    background:linear-gradient(145deg,#5865f2,#404bd6);

    box-shadow:
        0 0 30px rgba(88,101,242,.45);
}


/* FACEBOOK */

.facebook-logo{
    background:linear-gradient(145deg,#1877f2,#0755c9);

    box-shadow:
        0 0 30px rgba(24,119,242,.4);
}


.social-card h3{
    font-family:Georgia,serif;
    font-size:30px;
    font-weight:500;
    letter-spacing:2px;
    margin-bottom:10px;
}

.social-subtitle{
    color:#777;
    font-size:13px;
    letter-spacing:2px;
    margin-bottom:28px;
}

.social-feature{
    color:#d0d0d0;
    font-size:16px;
    margin-bottom:30px;
}

.social-button{
    display:block;

    width:90%;
    margin:auto;

    padding:16px;

    text-decoration:none;

    font-size:13px;
    font-weight:700;

    letter-spacing:3px;

    border:1px solid;

    background:rgba(255,255,255,.01);

    transition:.25s;
}


/* DISCORD BUTTON */

.discord-button{
    color:#6875ff;
    border-color:#4d58d8;
}

.discord-button:hover{
    color:white;
    background:#5865f2;
    box-shadow:0 0 25px rgba(88,101,242,.35);
}


/* FACEBOOK BUTTON */

.facebook-button{
    color:#4595ff;
    border-color:#1877f2;
}

.facebook-button:hover{
    color:white;
    background:#1877f2;
    box-shadow:0 0 25px rgba(24,119,242,.35);
}


/* MOBILE */

@media(max-width:700px){

    .social-grid{
        grid-template-columns:1fr;
    }

    .social-section{
        margin-top:55px;
    }

    .social-title h2{
        font-size:30px;
    }

    .social-card{
        min-height:370px;
    }

}

</style>


<section class="social-section" id="social">

    <div class="social-title">

        <div class="small-title">
            TEAMNOY COMMUNITY
        </div>

        <h2>
            GROUP COMMUNITY
        </h2>

        <p>
            Connect with TeamNoy members
        </p>

    </div>


    <div class="social-grid">


        <!-- DISCORD -->

        <div class="social-card">

            <div class="social-logo discord-logo">
                <span>☯</span>
            </div>

            <h3>
                DISCORD GROUP
            </h3>

            <div class="social-subtitle">
                JOIN OUR SERVER
            </div>

            <div class="social-feature">
                💬 &nbsp; Connect with Members
            </div>

            <!-- PALITAN ANG LINK -->

            <a
                class="social-button discord-button"
                href="https://discord.gg/YOURINVITE"
                target="_blank">

                JOIN DISCORD

            </a>

        </div>



        <!-- FACEBOOK -->

        <div class="social-card">

            <div class="social-logo facebook-logo">
                <span>f</span>
            </div>

            <h3>
                FACEBOOK GROUP
            </h3>

            <div class="social-subtitle">
                FOLLOW OUR COMMUNITY
            </div>

            <div class="social-feature">
                👥 &nbsp; Connect with TeamNoy
            </div>

            <!-- https://www.facebook.com/kristel.mirandilla.7 -->

            <a
                class="social-button facebook-button"
                href="https://facebook.com/YOURPAGE"
                target="_blank">

                FOLLOW FACEBOOK

            </a>

        </div>


    </div>

</section>
